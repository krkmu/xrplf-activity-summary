name: Daily Espresso

on:
  schedule:
    # Tuesday through Friday at 1:00 UTC
    - cron: '0 1 * * 2-5'
  workflow_dispatch:
    inputs:
      days_ago:
        description: 'Days ago (0 = today)'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Generate daily espresso
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAYS_AGO="${{ github.event.inputs.days_ago || '0' }}"
          npm run build
          node dist/daily.js --days-ago="$DAYS_AGO"

      - name: Commit espresso to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/daily/*.md || true
          git reset output/daily/*_input.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Add daily espresso $(date +%Y-%m-%d)"
          git push

      - name: Build HTML pages
        run: node scripts/build-pages.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
